# Витрина openfsp.ru (06.11.2026 переезд с Beget). Статика собирается локально (./site/deploy.sh в open-fsp/fsp).
# Traefik на этом сервере — в сети хоста, маршрут в /opt/traefik/dynamic.yml; контейнер слушает только 127.0.0.1.
services:
  openfsp_nginx:
    image: nginx:alpine
    container_name: openfsp_nginx
    restart: unless-stopped
    ports:
      - 127.0.0.1:8093:80
    volumes:
      - /opt/openfsp/dist:/usr/share/nginx/html:ro
      - /opt/openfsp/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
