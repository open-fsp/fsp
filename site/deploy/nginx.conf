user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # чего нет в mime.types: реестры отдаются как CSV, контракт API как YAML
  # (json уже описан выше; составное расширение вида .schema.json nginx не различает,
  #  схемы уходят как application/json — это верный тип)
  types {
    text/csv        csv;
    application/yaml yaml yml;
  }

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/csv text/xml
    application/json application/schema+json application/yaml
    application/javascript application/xml image/svg+xml;

  log_format main '$remote_addr - $status "$request" $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80;
    server_name openfsp.ru;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/json application/schema+json application/yaml text/csv;

    # /modules/core/ и /modules/core отдают одну и ту же страницу
    location / {
      try_files $uri $uri/index.html $uri/ =404;
    }

    # машиночитаемое читают из чужих скриптов и агентов
    location /1.0/ {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    location = /llms.txt {
      add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.(css|js|svg|woff2?)$ {
      add_header Cache-Control "public, max-age=604800" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
  }
}
